<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <a class="text-decoration-none fw-bold text-primary" href="../">← EventSphere</a>
          <div class="card border-0 shadow-sm mt-4">
            <div class="card-body p-4 p-lg-5">
              <h1 class="h3">Welcome back</h1>
              <p class="text-secondary">Sign in to continue to EventSphere.</p>
              <form id="loginForm" novalidate>
                <label class="form-label" for="email">Email</label>
                <input class="form-control mb-3" id="email" type="email" autocomplete="email" required />
                <label class="form-label" for="password">Password</label>
                <input class="form-control mb-3" id="password" type="password" autocomplete="current-password" required />
                <div id="loginMessage" class="small mb-3" role="alert"></div>
                <button class="btn btn-primary w-100" id="loginButton" type="submit">Sign in</button>
              </form>
              <p class="small text-secondary mt-4 mb-0">New to EventSphere? <a href="../register/">Create a student account</a>.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth-client.js"></script>
    <script>
      document.querySelector("#loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = document.querySelector("#loginMessage");
        const button = document.querySelector("#loginButton");
        message.textContent = "";
        button.disabled = true;
        button.textContent = "Signing in…";
        try {
          const client = await getSupabaseClient();
          const { data, error } = await client.auth.signInWithPassword({
            email: document.querySelector("#email").value.trim(),
            password: document.querySelector("#password").value,
          });
          if (error) throw error;
          await redirectByRole(data.session);
        } catch (error) {
          message.className = "small mb-3 text-danger";
          message.textContent = friendlyAuthError(error);
          button.disabled = false;
          button.textContent = "Sign in";
        }
      });
    </script>
  </body>
</html>
