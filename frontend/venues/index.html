<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venue management | EventSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-light">
  <nav class="navbar bg-white shadow-sm"><div class="container-fluid"><a class="navbar-brand fw-bold text-primary" href="../">EventSphere</a><span class="navbar-text">Venue Management</span><button id="logoutButton" class="btn btn-outline-secondary btn-sm">Log out</button></div></nav>
  <main class="container py-4">
    <div id="venueMessage" class="alert alert-info" role="status">Loading venue access…</div>
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4"><div><p class="page-kicker mb-1">Reserve with confidence</p><h1 class="h3 mb-1">Venue availability</h1><p id="venueIntro" class="text-secondary mb-0">Check a slot before submitting a booking.</p></div><a class="btn btn-outline-secondary" href="../">Back to EventSphere</a></div>
    <section class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">New booking</h2><form id="bookingForm" class="row g-3"><div class="col-md-6"><label class="form-label" for="bookingVenue">Venue</label><select id="bookingVenue" class="form-select" required></select></div><div class="col-md-6"><label class="form-label" for="bookingTitle">Purpose</label><input id="bookingTitle" class="form-control" maxlength="200" required></div><div class="col-md-4"><label class="form-label" for="bookingDate">Date</label><input id="bookingDate" class="form-control" type="date" required></div><div class="col-md-4"><label class="form-label" for="bookingStart">Start time</label><input id="bookingStart" class="form-control" type="time" required></div><div class="col-md-4"><label class="form-label" for="bookingEnd">End time</label><input id="bookingEnd" class="form-control" type="time" required></div><div class="col-12"><button id="checkAvailability" class="btn btn-outline-primary" type="button">Check availability</button><button id="bookVenue" class="btn btn-primary ms-2" type="submit">Book venue</button><span id="bookingFeedback" class="small ms-2" role="status"></span></div></form></div></section>
    <section id="calendarSection" class="card border-0 shadow-sm mb-4 d-none"><div class="card-body"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div><h2 class="h5 mb-1">Availability calendar</h2><p class="text-secondary small mb-0">Organizers and administrators can view venue occupancy.</p></div><input id="calendarDate" class="form-control" type="date" style="max-width: 180px"></div><div id="calendarGrid" class="row g-3 mt-2"></div></div></section>
    <section id="adminSection" class="card border-0 shadow-sm d-none"><div class="card-body"><h2 class="h5">Admin venue controls</h2><form id="venueForm" class="row g-2 mb-3"><div class="col-md-4"><label class="visually-hidden" for="venueName">Name</label><input id="venueName" class="form-control" placeholder="Venue name" required></div><div class="col-md-4"><label class="visually-hidden" for="venueLocation">Location</label><input id="venueLocation" class="form-control" placeholder="Location" required></div><div class="col-md-2"><label class="visually-hidden" for="venueCapacity">Capacity</label><input id="venueCapacity" class="form-control" type="number" min="1" placeholder="Capacity" required></div><div class="col-md-2"><button class="btn btn-dark w-100" type="submit">Add venue</button></div></form><div id="venueRows" class="table-responsive"></div><h2 class="h5 mt-4">All bookings</h2><div id="bookingRows" class="table-responsive"></div></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="../assets/js/auth-client.js" defer></script><script src="../assets/js/venues.js" defer></script>
</body>
</html>
