<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <a class="text-decoration-none fw-bold text-primary" href="../">← EventSphere</a>
          <div class="card border-0 shadow-sm mt-4">
            <div class="card-body p-4 p-lg-5">
              <h1 class="h3">Create your account</h1>
              <p class="text-secondary">Public registration creates a student account. Organizer and admin roles are controlled separately.</p>
              <form id="registerForm" novalidate>
                <div class="row g-3">
                  <div class="col-12"><label class="form-label" for="fullName">Full name</label><input class="form-control" id="fullName" required /></div>
                  <div class="col-md-7"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" autocomplete="email" required /></div>
                  <div class="col-md-5"><label class="form-label" for="year">Year</label><input class="form-control" id="year" type="number" min="1" max="8" required /></div>
                  <div class="col-12"><label class="form-label" for="department">Department</label><input class="form-control" id="department" required /></div>
                  <div class="col-md-6"><label class="form-label" for="phone">Phone <span class="text-secondary">(optional)</span></label><input class="form-control" id="phone" type="tel" /></div>
                  <div class="col-md-6"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" minlength="6" autocomplete="new-password" required /></div>
                  <div class="col-12"><label class="form-label" for="confirmPassword">Confirm password</label><input class="form-control" id="confirmPassword" type="password" autocomplete="new-password" required /></div>
                </div>
                <div id="registerMessage" class="small mt-3" role="alert"></div>
                <button class="btn btn-primary w-100 mt-3" id="registerButton" type="submit">Create student account</button>
              </form>
              <p class="small text-secondary mt-4 mb-0">Already registered? <a href="../login/">Sign in</a>.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/auth-client.js"></script>
    <script>
      document.querySelector("#registerForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = document.querySelector("#registerMessage");
        const button = document.querySelector("#registerButton");
        const password = document.querySelector("#password").value;
        const confirmation = document.querySelector("#confirmPassword").value;
        if (password !== confirmation) {
          message.className = "small mt-3 text-danger";
          message.textContent = "Passwords do not match.";
          return;
        }
        button.disabled = true;
        button.textContent = "Creating account…";
        message.textContent = "";
        try {
          const client = await getSupabaseClient();
          const { data, error } = await client.auth.signUp({
            email: document.querySelector("#email").value.trim(),
            password,
            options: {
              data: {
                full_name: document.querySelector("#fullName").value.trim(),
                department: document.querySelector("#department").value.trim(),
                year: document.querySelector("#year").value,
                phone: document.querySelector("#phone").value.trim(),
              },
            },
          });
          if (error) throw error;
          if (data.session) {
            await redirectByRole(data.session);
          } else {
            message.className = "small mt-3 text-success";
            message.textContent = "Account created. Check your email to confirm it, then sign in.";
            button.disabled = false;
            button.textContent = "Create student account";
          }
        } catch (error) {
          message.className = "small mt-3 text-danger";
          message.textContent = friendlyAuthError(error);
          button.disabled = false;
          button.textContent = "Create student account";
        }
      });
    </script>
  </body>
</html>
