<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event pass | EventSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
  <main class="container py-5">
    <a class="text-decoration-none fw-bold text-primary" href="../registrations/">← My registrations</a>
    <h1 class="h3 mt-4">Event pass</h1>
    <div id="passMessage" class="small text-secondary mt-3" role="status" aria-live="polite">Loading pass…</div>
    <button id="retryPass" class="btn btn-outline-primary btn-sm mt-2 d-none" type="button">Try again</button>
    <section id="passCard" class="card border-0 shadow-sm mt-3 d-none">
      <div class="card-body">
        <h2 id="eventTitle" class="h4"></h2>
        <p id="eventDetails" class="text-secondary"></p>
        <p id="studentDetails" class="small"></p>
        <div class="d-flex align-items-center gap-2 mt-3">
          <span class="badge text-bg-success">Registration Confirmed</span>
          <span id="participationType" class="badge text-bg-secondary"></span>
        </div>
        <div id="teamDetails" class="mt-3 small text-secondary d-none"></div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/auth-client.js"></script>
  <script src="../../assets/js/event-pass.js"></script>
</body>
</html>
