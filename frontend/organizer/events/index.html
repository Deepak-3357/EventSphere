<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage events | EventSphere</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../../assets/css/styles.css"></head>
<body class="bg-light"><main class="container py-4 py-lg-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><a class="text-decoration-none fw-bold text-primary" href="../../dashboard/organizer/">← Organizer dashboard</a><h1 class="h3 mt-3">Manage events</h1></div><button id="newEventButton" class="btn btn-primary">New event</button></div><div id="message" class="alert alert-info">Loading…</div><section class="row g-4"><div class="col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Your events</h2><select id="statusFilter" class="form-select form-select-sm w-auto" aria-label="Filter events by status"><option value="">All statuses</option><option value="draft">Draft</option><option value="pending">Pending</option><option value="published">Published</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="eventList" class="list-group"></div></div></div></div><div class="col-lg-7"><form id="eventForm" class="card border-0 shadow-sm d-none"><div class="card-body"><h2 id="formTitle" class="h5">Create event</h2><input type="hidden" id="eventId"><div class="row g-3 mt-1"><div class="col-12"><label class="form-label" for="title">Title</label><input id="title" class="form-control" required maxlength="200"></div><div class="col-12"><label class="form-label" for="description">Description</label><textarea id="description" class="form-control" rows="3" maxlength="5000"></textarea></div><div class="col-md-6"><label class="form-label" for="category">Category</label><select id="category" class="form-select" required></select></div><div class="col-md-6"><label class="form-label" for="venue">Venue</label><select id="venue" class="form-select" required></select></div><div class="col-md-4"><label class="form-label" for="eventDate">Date</label><input id="eventDate" type="date" class="form-control" required></div><div class="col-md-4"><label class="form-label" for="startTime">Start</label><input id="startTime" type="time" class="form-control" required></div><div class="col-md-4"><label class="form-label" for="endTime">End</label><input id="endTime" type="time" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="deadline">Registration deadline</label><input id="deadline" type="datetime-local" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="capacity">Capacity</label><input id="capacity" type="number" min="1" class="form-control" required></div><div class="col-12"><label class="form-label" for="imageUrl">Cover image URL</label><input id="imageUrl" type="url" class="form-control" placeholder="https://…"><div class="form-text">Use a trusted HTTPS image URL. A polished fallback is shown when empty or unavailable.</div></div><div class="col-md-6"><label class="form-label" for="participationMode">Participation</label><select id="participationMode" class="form-select"><option value="individual">Individual only</option><option value="team">Team only</option><option value="both">Individual or team</option></select></div><div class="col-md-3"><label class="form-label" for="minTeamSize">Minimum team size</label><input id="minTeamSize" type="number" min="2" max="100" class="form-control"></div><div class="col-md-3"><label class="form-label" for="maxTeamSize">Maximum team size</label><input id="maxTeamSize" type="number" min="2" max="100" class="form-control"></div><div class="col-12"><label class="form-label" for="eligibility">Eligibility</label><textarea id="eligibility" class="form-control" rows="2" maxlength="2000"></textarea></div><div class="col-12"><label class="form-label" for="instructions">Registration instructions</label><textarea id="instructions" class="form-control" rows="2" maxlength="3000"></textarea></div><div class="col-12"><label class="form-label" for="facilities">Facilities (JSON)</label><textarea id="facilities" class="form-control" rows="2">{}</textarea><div class="form-text">Use simple key/value JSON for public facility details.</div></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save event</button><button class="btn btn-outline-secondary" type="button" id="cancelButton">Cancel</button></div></div></form><section id="faqSection" class="card border-0 shadow-sm mt-4 d-none"><div class="card-body"><h2 class="h5">FAQs</h2><div id="faqList"></div><form id="faqForm" class="row g-2 mt-2"><div class="col-md-5"><label class="visually-hidden" for="faqQuestion">Question</label><input id="faqQuestion" class="form-control" placeholder="Question" required maxlength="300"></div><div class="col-md-5"><label class="visually-hidden" for="faqAnswer">Answer</label><input id="faqAnswer" class="form-control" placeholder="Answer" required maxlength="3000"></div><div class="col-md-2"><button class="btn btn-outline-primary w-100" type="submit">Add</button></div></form></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/auth-client.js"></script><script src="manage.js"></script></body></html>
